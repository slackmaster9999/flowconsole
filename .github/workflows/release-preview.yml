name: Release Preview

on:
  push:
    branches: ['feature/**']
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-preview:
    env:
      NEXT_PUBLIC_APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    environment:
      name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: |
          pnpm --filter @flowconsole/core test

      - name: Version packages (snapshot beta)
        run: pnpm changeset version --snapshot beta

      - name: Build SDK artifacts (jsii + pacmak)
        run: |
          pnpm --dir src/sdk package

      - name: Publish preview packages (beta tag)
        run: pnpm -r publish --tag beta --no-git-checks
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check Python SDK artifacts
        id: python_artifacts
        run: |
          if ls dist/python/*.whl >/dev/null 2>&1 || ls dist/python/*.tar.gz >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Python artifacts found in dist/python; skipping publish."
          fi
        working-directory: src/sdk

      - name: Setup Python
        if: steps.python_artifacts.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publish PyPI packages (beta)
        if: steps.python_artifacts.outputs.found == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python/
          password: ${{ secrets.PYPI_API_TOKEN }}
        working-directory: src/sdk

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish NuGet packages (beta)
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        working-directory: src/sdk
        run: |
          NUGET_PACKAGES=$(find dist/dotnet -type f -name "*.nupkg")
          if [ -z "$NUGET_PACKAGES" ]; then
            echo "No NuGet packages found in dist/dotnet; skipping publish."
            exit 0
          fi
          dotnet nuget push $NUGET_PACKAGES \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
